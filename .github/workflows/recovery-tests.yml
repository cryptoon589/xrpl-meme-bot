name: Recovery safety tests

on:
  push:
    branches:
      - recovery/**
  pull_request:
    paths:
      - 'scripts/prepare_recovery_db.py'
      - 'scripts/test_prepare_recovery_db.py'
      - 'scripts/recovery_preflight.py'
      - '.github/workflows/recovery-tests.yml'
  workflow_dispatch:

jobs:
  recovery-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test SQLite recovery on synthetic database
        run: python3 scripts/test_prepare_recovery_db.py scripts/recovery_preflight.py
      - name: Python syntax validation
        run: python3 -m py_compile scripts/prepare_recovery_db.py scripts/test_prepare_recovery_db.py
