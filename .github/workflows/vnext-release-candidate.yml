name: Hunterix vNext PAPER release candidate

on:
  push:
    branches:
      - release/hunterix-vnext-paper-20261116
      - fix/hunterix-vnext-meme-only-20261116
      - feature/hunterix-dynamic-meme-universe-20261121
      - feature/hunterix-strategy-v21-20261122
  pull_request:
    branches:
      - feature/hunterix-dynamic-meme-universe-20261121
  workflow_dispatch:

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Compile strict TypeScript
        run: |
          npm ci
          npm run build
      - name: Existing PAPER accounting, execution, Telegram and learning invariants
        run: |
          node scripts/test_paper_accounting_recovery.js
          node scripts/test_reserve_paper_execution.js
          node scripts/test_amm_sell_quotes.js
          node scripts/test_learning_gate.js
          node scripts/test_telegram_reporting_integrity.js
      - name: XRPL rate-limit/1008 cooldown and no-extra-RPC regression
        run: node scripts/test_xrpl_rpc_overload.js
      - name: XRP Ledger websocket 1008 stream and RPC reconnect backoff
        run: node scripts/test_xrpl_reconnect_backoff.js
      - name: User-approved four-token blacklist and main XRPL ARMY issue AMM price regression
        run: node scripts/test_army_pricing_and_blacklist.js
      - name: Meme-only PAPER trade eligibility regression
        run: node scripts/test_meme_entry_universe.js
      - name: Dynamic meme evidence and rotating scan regressions (mock provider only)
        run: node scripts/test_dynamic_meme_universe.js
      - name: Dynamic meme XRPL RPC budget regressions (offline)
        run: node scripts/test_dynamic_rpc_budget.js
      - name: Prevent concurrent different-issuer same-ticker PAPER exposure
        run: node scripts/test_open_ticker_collision.js
      - name: Verify source-backed project issuer for protected names (offline)
        run: node scripts/test_verified_project_issuers.js
      - name: Dynamic PAPER performance audit versus 16-trade baseline (SQLite offline)
        run: python3 scripts/test_dynamic_paper_performance.py
      - name: 'Read-only post-activation strategy audit: trade attribution and evidence quality'
        run: python3 scripts/test_dynamic_paper_strategy.py
      - name: 'Strategy V2 PAPER: STREAM observation-only, qualified evidence and future-window report'
        run: |
          node scripts/test_paper_stream_shadow_v2.js
          python3 scripts/test_paper_stream_shadow_report.py
          python3 -m py_compile scripts/audit_paper_stream_shadow.py
          node scripts/test_paper_opportunity_events.js
          python3 scripts/test_paper_opportunity_timeline.py
          python3 -m py_compile scripts/audit_paper_opportunity_timeline.py
      - name: PAPER entry-only freeze and restart-safe exit-state checkpoint (synthetic SQLite)
        run: |
          node scripts/test_paper_exit_only_restart.js
          node --check scripts/paper_entry_control.js
          python3 -m py_compile scripts/check_paper_restart_safety.py scripts/guarded_flat_paper_cutover.py
          python3 scripts/test_guarded_flat_cutover.py
          python3 scripts/test_legacy_paper_entry_gate.py
          node scripts/test_legacy_paper_gate_trader_contract.js
          python3 -m py_compile scripts/arm_legacy_paper_entry_gate.py
          python3 scripts/test_watch_flat_paper_cutover.py
          python3 -m py_compile scripts/watch_flat_paper_cutover.py
      - name: Whale, burst, validated new launches and operator blacklist
        run: |
          node scripts/test_manual_blacklist.js
          node scripts/test_whale_signal_integrity.js
          node scripts/test_top_trader_webhook_security.js
          node scripts/test_burst_launch_integrity.js
          node scripts/test_validated_launch.js
      - name: Persistent temporary reentry quarantine (not permanent blacklist)
        run: node scripts/test_vnext_loss_quarantine.js
      - name: PAPER-only deployment guard and typed PM2 config
        run: |
          bash -n scripts/vnext_paper_entrypoint.sh
          node --check ecosystem.vnext.paper.config.cjs
          node - <<'JS'
          const assert=require('node:assert/strict');
          const p='./ecosystem.vnext.paper.config.cjs';
          assert.throws(()=>require(p),/epoch ID absent/);
          process.env.HUNTERIX_VNEXT_EPOCH_ID='meme_bot.paper-epoch-20261116-ci';
          process.env.HUNTERIX_LEGACY_SOURCE_DB_PATH='/root/legacy-original/data/meme_bot.recovery.db';
          delete require.cache[require.resolve(p)];
          assert.throws(()=>require(p),/Approved operator-manifest SHA256/);
          process.env.HUNTERIX_VNEXT_XRPL_WS_URL='wss://xrplcluster.com';
          process.env.HUNTERIX_OPERATOR_BLACKLIST_APPROVED_SHA256='a'.repeat(64);
          process.env.HUNTERIX_OPERATOR_MEME_ALLOWLIST_APPROVED_SHA256='b'.repeat(64);
          delete require.cache[require.resolve(p)];
          const e=require(p).apps[0].env;
          assert.equal(e.XRPL_WS_URL,'wss://xrplcluster.com');
          assert.equal(e.XRPL_RPC_MAX_INFLIGHT,'2');
          assert.equal(e.XRPL_RPC_MAX_PER_SEC,'3');
          assert.equal(e.MODE,'PAPER');
          assert.equal(e.LIVE_TRADING,'false');
          assert.equal(e.TRADING_WALLET_SEED,'');
          assert.equal(e.BOT_USE_RESERVE_QUOTES,'1');
          assert.equal(e.BOT_PAPER_MEME_ONLY,'1');
          assert.equal(e.BOT_PAPER_STREAM_SHADOW_ONLY,'1');
          assert.ok(e.HUNTERIX_MEME_ENTRY_ALLOWLIST_FILE.endsWith('paper_meme_entry_allowlist.json'));
          assert.equal(e.BOT_ENABLE_LIQUIDITY_LOSS_GUARD,'1');
          assert.equal(e.BOT_DB_PATH.endsWith('meme_bot.paper-epoch-20261116-ci.db'),true);
          console.log('PASS explicit epoch, approved blacklist and safe PAPER PM2 configuration');
          JS
      - name: Telegram-only staged credential copy (synthetic secrets, no remote calls)
        run: node scripts/test_vnext_telegram_env.js
      - name: Syntax of stage-only ARMY endpoint and database safety scripts
        run: |
          node --check scripts/diagnose_army_using_legacy_endpoint.js
          node --check scripts/diagnose_army_price.js
          node --check scripts/prepare_vnext_telegram_env.js
          python3 -m py_compile scripts/stage_vnext_safely.py scripts/test_vnext_stage.py
      - name: Independent VPS staging and active-WAL online-backup safety fixture
        run: python3 scripts/test_vnext_stage.py
      - name: Read-only cutover plan, manual review digest and restart-safety tests
        run: |
          python3 -m py_compile scripts/vnext_preflight.py scripts/legacy_positions_report.py
          python3 scripts/test_vnext_release_preflight.py
